<!DOCTYPE html>
2 <html lang="pt-BR">
3 <head>
4 <meta charset="UTF-8">
5 <title>Inscrição em Minicurso</title>
6 </head>
7 <body>

<h1>Incrição em minicurso</h1>
<p>Preencha os dados abaixo para realizar a sua inscrição</p>

<form>
    <label for="nome">Nome completo:</label><br>
    <input type="text" id="nome" name="nome">
    <br><br>

    <label for="email">E-mail:</label><br>
    <input type="email" id="email" name="email">

    <p>Turno</p>
    
    <input type="radio" id="manha" name="turno" value="manha">
    <label for="manha">Manhã</label>

    <input type="radio" id="noite" name="turno" value="noite">
    <label for="noite">Noite</label>

    <br><br>

    <label for="curso">Curso de Interesse</label><br>
    <select id="curso" name="curso">
        <option>HTML e CSS</option>
    </select>

    <br><br>

    <button type="submite">Enviar Inscrição</button>
    <button type="reset">Limpar</button>
</form>

</body>
</html>
