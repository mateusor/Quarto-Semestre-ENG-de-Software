<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>

<body>
    <h1>Contato</h1>
    <form>
        <label form="name">Nome:</label>
        <input type="text" id="nome" name="nome">
        <br><br>

        <label form="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone">
        <br><br>

        <p>Assunto:</p>

        <input type="radio" id="suporte" name="assunto" value="suporte">
        <label form="suporte">Suporte</label>

        <input type="radio" id="vendas" name="assunto" value="vendas">
        <label form="vendas">Vendas</label>
        <br><br>

        <textarea id="mensagem" name="mensagem" row="5" col="30"></textarea>

        <button type="submit">E</button>
    </form>
</body>
</html>
